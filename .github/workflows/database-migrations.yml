name: Production database migrations

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      source_sha:
        required: true
        type: string
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: false
      SUPABASE_DB_PASSWORD:
        required: false
      EXPO_PUBLIC_SUPABASE_URL:
        required: false

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-database
    concurrency:
      group: production-database-migrations
      cancel-in-progress: false
    steps:
      - name: Validate invocation
        env:
          MODE: ${{ inputs.mode }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$MODE" == "check" || "$MODE" == "apply" ]] || exit 1
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || exit 1
          if [[ "$MODE" == "apply" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_EVENT_NAME" == "push" ]] || exit 1
            [[ "$SOURCE_SHA" == "$GITHUB_SHA" ]] || exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v3
        if: inputs.mode == 'apply'
        with:
          version: 3.0.0
      - name: Check or deploy migrations
        env:
          MIGRATION_MODE: ${{ inputs.mode }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
          SUPABASE_MIGRATIONS_BASELINED: ${{ vars.SUPABASE_MIGRATIONS_BASELINED }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ inputs.mode == 'apply' && secrets.SUPABASE_DB_PASSWORD || '' }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
        run: node scripts/db-migrations.cjs "$MIGRATION_MODE"
